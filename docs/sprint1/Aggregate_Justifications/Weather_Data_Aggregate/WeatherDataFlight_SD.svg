 textLength="299.8395" x="1848" y="1811.0068">inside FlightPlan; a Value Object</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="326.2795" x="1848" y="1838.2468">within Flight. FlightPlan is replaced</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="285.3996" x="1848" y="1865.4867">as a whole since Value Objects</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="290.7396" x="1848" y="1892.7267">are immutable; consistent with</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="288.2197" x="1848" y="1919.9667">the DDD principle that VOs are</text><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="214.4998" x="1848" y="1947.2067">replaced, not mutated.</text><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg32"><polygon fill="#181818" points="2493.6665,1992.3066,2503.6665,1996.3066,2493.6665,2000.3066,2497.6665,1996.3066" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1837.2477" x2="2499.6665" y1="1996.3066" y2="1996.3066"/><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="649.4189" x="1844.2477" y="1988.4466">save(flight.updateFlightPlan(flightPlan.withWeather(weatherDataId)))</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg33"><polygon fill="#181818" points="1848.2477,2033.5466,1838.2477,2037.5466,1848.2477,2041.5466,1844.2477,2037.5466" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="1842.2477" x2="2509.6665" y1="2037.5466" y2="2037.5466"/><text fill="#000000" font-family="sans-serif" font-size="20" lengthAdjust="spacing" textLength="131.5598" x="1854.2477" y="2029.6866">updatedFlight</text></g><g class="message" data-ent